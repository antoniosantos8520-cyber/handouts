<title>Mercenary Dossier</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Germania+One&family=Markazi+Text:wght@400..700&family=Platypi:ital,wght@0,400..800;1,400..800&display=swap">

<style>
/* ============================================================
   TOKENS — the booklet is paper in every theme; only the desk answers.
   ============================================================ */
:root{
  --ink:#12110f; --ink-2:#3f3a33; --ink-3:#6b6459;
  --rule:#a8a298; --rule-2:#c4bdb1;
  --paper:#f3ede1; --paper-2:#ebe4d5; --paper-edge:#d9d0bd; --stripe:#e4ddcd;
  --blood:#7d2b22; --blood-2:#a13d31; --brass:#a8792f; --brass-2:#c9a25a;
  --lost:#2a2420; --expended:#b9afa0; --persist:#3f6a52;
  --adv:#3f6a52; --dis:#7d2b22;
  --stage:#cfc7b6; --stage-2:#bfb5a0; --chrome-fg:#2a2621; --chrome-dim:#6b6355;
  --chrome-bg:#e0d8c8; --chrome-line:#b9b09d; --shadow:rgba(40,32,20,.38);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stage:#171512; --stage-2:#0e0d0b; --chrome-fg:#ece3d1; --chrome-dim:#928873;
    --chrome-bg:#211e18; --chrome-line:#3b352b; --shadow:rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --stage:#171512; --stage-2:#0e0d0b; --chrome-fg:#ece3d1; --chrome-dim:#928873;
  --chrome-bg:#211e18; --chrome-line:#3b352b; --shadow:rgba(0,0,0,.65);
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--chrome-fg);
  background:var(--stage);
  background-image:radial-gradient(125% 85% at 50% -5%,var(--stage) 0%,var(--stage-2) 100%);
  background-attachment:fixed;
  font-family:"Platypi",Georgia,serif;
}
.chrome{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:9px 18px;
  border-bottom:1px solid var(--chrome-line);background:var(--chrome-bg);position:sticky;top:0;z-index:30;
}
.chrome__mark{font-family:"Germania One",Impact,fantasy;font-size:17px;letter-spacing:.09em;text-transform:uppercase;line-height:1;margin-right:auto}
.chrome__mark small{display:block;font-family:"Platypi",serif;font-size:8.5px;letter-spacing:.3em;font-weight:600;color:var(--chrome-dim);margin-top:4px;text-transform:uppercase}
.hint{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--chrome-dim)}
.hint kbd{font-family:"Germania One",monospace;letter-spacing:0;font-size:11px;border:1.4px solid var(--chrome-line);padding:1px 5px;margin:0 2px}
.sizer{display:flex;align-items:center;gap:6px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--chrome-dim)}
.sizer button{font-family:"Germania One",Impact,fantasy;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--chrome-fg);
  background:transparent;border:1.4px solid var(--chrome-line);padding:4px 8px 3px;cursor:pointer;line-height:1}
.sizer button:hover{background:var(--chrome-fg);color:var(--chrome-bg)}
.sizer output{font-family:"Markazi Text",serif;font-size:13px;letter-spacing:0;min-width:74px;text-align:center;color:var(--chrome-fg)}
@media (max-width:900px){.hint{display:none}}

/* ============================================================
   DESK + WINDOW — the sheet lives in a resizable frame with hard
   min/max stops, because VTT screen space is the scarcest resource.
   ============================================================ */
.desk{padding:22px 16px 60px;display:flex;justify-content:center}
.win{
  position:relative;width:var(--fw,700px);height:var(--fh,700px);
  min-width:560px;min-height:560px;max-width:1180px;max-height:1180px;
  background:var(--paper);box-shadow:0 24px 54px -18px var(--shadow),0 0 0 1px var(--paper-edge);
}
.win__bar{
  position:absolute;left:0;right:0;top:-25px;height:25px;display:flex;align-items:center;gap:8px;padding:0 10px;
  background:var(--chrome-bg);border:1px solid var(--chrome-line);border-bottom:0;color:var(--chrome-dim);
  font-family:"Germania One",Impact,fantasy;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
}
.win__bar b{color:var(--chrome-fg);font-weight:400}
.win__bar span{margin-left:auto;font-family:"Markazi Text",serif;letter-spacing:0;font-size:12px}
/* drag grips: right edge, bottom edge, corner */
.grip{position:absolute;z-index:20;touch-action:none}
.grip--e{top:0;bottom:14px;right:-4px;width:9px;cursor:ew-resize}
.grip--s{left:0;right:14px;bottom:-4px;height:9px;cursor:ns-resize}
.grip--se{right:-4px;bottom:-4px;width:20px;height:20px;cursor:nwse-resize}
.grip--se::after{content:"";position:absolute;right:4px;bottom:4px;width:11px;height:11px;
  background:repeating-linear-gradient(135deg,var(--rule) 0 1.5px,transparent 1.5px 4px)}
.win.dragging{user-select:none}
.win.atmin,.win.atmax{box-shadow:0 24px 54px -18px var(--shadow),0 0 0 2px var(--brass)}

/* the booklet is designed once at BASE and scaled to the window */
.scaler{position:absolute;left:50%;top:50%;width:700px;height:700px;
  transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center}
.stack{position:absolute;inset:0;pointer-events:none}
.stack i{position:absolute;inset:0;background:var(--paper-2);border:1px solid var(--paper-edge)}
.stack i:nth-child(1){transform:translate(5px,4px) rotate(.3deg)}
.stack i:nth-child(2){transform:translate(2.5px,2px) rotate(-.18deg)}
.booklet{position:absolute;inset:0;background:var(--paper);color:var(--ink);box-shadow:0 0 0 1px var(--paper-edge)}
.booklet::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:18px;
  background:linear-gradient(90deg,rgba(18,17,15,.13),rgba(18,17,15,.03) 60%,transparent);pointer-events:none;z-index:5;
}
.stitch{position:absolute;left:7px;top:44px;bottom:44px;width:3px;z-index:6;pointer-events:none;
  background:repeating-linear-gradient(to bottom,var(--ink-3) 0 12px,transparent 12px 22px);opacity:.5;border-radius:2px}

/* ---- pages ---- */
.page{position:absolute;left:0;right:0;top:0;bottom:34px;display:none;flex-direction:column;overflow:hidden}
.page.on{display:flex}
.page--cover{bottom:0}
.sheet{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 16px 8px 30px}

/* ---- cover ---- */
.cover{position:relative;height:100%;cursor:pointer}
.cover img{width:100%;height:100%;object-fit:cover;object-position:50% 16%;display:block;filter:saturate(.92) contrast(1.02)}
.cover::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(18,17,15,.88) 0%,rgba(18,17,15,.55) 24%,rgba(18,17,15,0) 50%),
             linear-gradient(to bottom,rgba(18,17,15,.35),transparent 18%)}
.cover__top{position:absolute;left:30px;right:20px;top:20px;display:flex;justify-content:space-between;align-items:flex-start;z-index:2;color:var(--paper)}
.cover__mark{font-family:"Germania One",Impact,fantasy;font-size:14px;letter-spacing:.16em;text-transform:uppercase;opacity:.92}
.cover__mark small{display:block;font-family:"Platypi",serif;font-weight:600;font-size:8.5px;letter-spacing:.3em;margin-top:4px;opacity:.75}
.cover__lvl{font-family:"Markazi Text",serif;font-weight:700;font-size:40px;line-height:1;text-align:center}
.cover__lvl span{display:block;font-family:"Germania One",Impact,fantasy;font-size:9px;letter-spacing:.26em;text-transform:uppercase;opacity:.8;margin-top:-2px}
.cover__title{position:absolute;left:30px;right:20px;bottom:66px;z-index:2;color:var(--paper)}
.cover__name{font-family:"Germania One",Impact,fantasy;font-size:64px;line-height:.95;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.cover__sub{display:flex;align-items:center;gap:9px;margin-top:9px;font-family:"Platypi",serif;font-style:italic;font-size:14px;opacity:.92}
.cover__sub b{font-style:normal;font-family:"Germania One",Impact,fantasy;font-weight:400;letter-spacing:.06em;font-size:13.5px}
.cover__sub i.dot{width:5px;height:5px;background:var(--brass-2);transform:rotate(45deg);display:inline-block}
.cover__open{position:absolute;right:20px;bottom:66px;z-index:2;color:var(--paper);font-family:"Germania One",Impact,fantasy;font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.8;display:flex;align-items:center;gap:7px}
.cover__open::after{content:"";width:24px;height:1.5px;background:var(--brass-2)}

/* ============================================================
   RAIL — the slim header. Everywhere but Profile this is the whole
   top chrome: portrait · name · level · HP. Nothing else earns the pixels.
   ============================================================ */
.rail{flex:none;display:flex;align-items:center;gap:9px;height:34px;padding:0 0 4px;border-bottom:2px solid var(--ink);position:relative}
.rail::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1.2px;background:var(--ink)}
.tokbtn{flex:none;width:26px;height:26px;padding:0;border:0;background:transparent;cursor:pointer;border-radius:50%}
.tokbtn img{width:26px;height:26px;border-radius:50%;object-fit:cover;object-position:50% 26%;display:block;
  border:1.6px solid var(--ink);box-shadow:0 0 0 1.6px var(--paper),0 0 0 2.8px var(--brass);transition:box-shadow .15s}
.tokbtn:hover img{box-shadow:0 0 0 1.6px var(--paper),0 0 0 3.4px var(--blood)}
.tokbtn:focus-visible{outline:2.5px solid var(--brass);outline-offset:2px}
.railname{border:0;background:transparent;padding:0;cursor:pointer;font-family:"Germania One",Impact,fantasy;font-size:20px;
  letter-spacing:.02em;text-transform:uppercase;color:var(--ink);line-height:1;display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.railname small{font-family:"Platypi",serif;font-style:italic;font-size:10px;letter-spacing:0;text-transform:none;color:var(--ink-3)}
.railname:hover{color:var(--blood)}
.railname:hover small{color:var(--blood-2)}
.railname:focus-visible{outline:2.5px solid var(--brass);outline-offset:2px}
.railgap{flex:1;min-width:8px;height:1.2px;background:var(--rule-2)}
.railv{flex:none;display:flex;align-items:baseline;gap:5px;font-family:"Germania One",Impact,fantasy;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.railv b{font-family:"Markazi Text",serif;font-weight:700;font-size:20px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.railv--hp b{color:var(--blood)}
.railv em{font-style:normal;color:var(--ink-3);font-size:13px}
.railbar{flex:none;width:70px;height:5px;background:var(--stripe);position:relative;align-self:center;box-shadow:inset 0 0 0 1px var(--rule-2)}
.railbar i{position:absolute;left:0;top:0;bottom:0;background:var(--blood);width:var(--p,76%)}

/* ---- full masthead: Profile page only ---- */
.hdr{flex:none;display:grid;grid-template-columns:64px 1fr auto;gap:0 13px;align-items:center;padding:12px 0 10px;border-bottom:2.2px solid var(--ink);position:relative}
.hdr::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:1.4px;background:var(--ink)}
.hdr__img{width:64px;height:64px;padding:0;border:0;background:transparent;cursor:pointer;border-radius:50%}
.hdr__img img{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:50% 26%;display:block;
  border:2.2px solid var(--ink);box-shadow:0 0 0 2.6px var(--paper),0 0 0 4px var(--brass);transition:box-shadow .15s}
.hdr__img:hover img{box-shadow:0 0 0 2.6px var(--paper),0 0 0 4.6px var(--blood)}
.hdr__img:focus-visible{outline:2.5px solid var(--brass);outline-offset:3px}
.hdr__id{min-width:0}
.hdr__name{font-family:"Germania One",Impact,fantasy;font-size:30px;line-height:1;text-transform:uppercase;display:flex;align-items:baseline;gap:9px}
.hdr__name small{font-family:"Platypi",serif;font-style:italic;font-size:12px;letter-spacing:0;text-transform:none;color:var(--ink-3)}
.hdr__line{margin-top:5px;display:flex;align-items:center;gap:8px;font-family:"Platypi",serif;font-size:12px;color:var(--ink-2)}
.hdr__line b{font-family:"Germania One",Impact,fantasy;font-weight:400;font-size:12.5px;letter-spacing:.04em;color:var(--ink)}
.hdr__line i.dot{width:5px;height:5px;background:var(--ink);transform:rotate(45deg);display:inline-block;flex:none}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 1px;border:1.5px solid var(--ink);
  font-family:"Germania One",Impact,fantasy;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  clip-path:polygon(5px 0,calc(100% - 5px) 0,100% 5px,100% calc(100% - 5px),calc(100% - 5px) 100%,5px 100%,0 calc(100% - 5px),0 5px)}
.badge b{font-family:"Markazi Text",serif;font-weight:700;font-size:13px;color:var(--blood);line-height:1}
.vitals{display:flex;gap:12px}
.vital{text-align:center;min-width:52px}
.vital span{display:block;font-family:"Germania One",Impact,fantasy;font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.vital b{display:block;font-family:"Markazi Text",serif;font-weight:700;font-size:25px;line-height:1.05;color:var(--ink);font-variant-numeric:tabular-nums}
.vital b em{font-style:normal;color:var(--ink-3);font-size:16px}
.vital--hp b{color:var(--blood)}
.hpbar{height:5px;background:var(--stripe);margin-top:3px;position:relative}
.hpbar i{position:absolute;left:0;top:0;bottom:0;background:var(--blood);width:var(--p,76%)}

/* ============================================================
   PAGE BODY PRIMITIVES
   ============================================================ */
.body{flex:1;min-height:0;padding-top:11px;display:flex;flex-direction:column;gap:10px}
.sec{display:flex;align-items:center;gap:8px;margin:0;flex:none}
.sec h2{margin:0;font-family:"Germania One",Impact,fantasy;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;line-height:1;white-space:nowrap}
.sec i{flex:1;height:0;border-top:1.6px solid var(--ink)}
.sec small{font-family:"Platypi",serif;font-size:10px;color:var(--ink-3);font-style:italic;white-space:nowrap}
.frame{--notch:8px;position:relative;background:var(--ink);padding:2px;
  clip-path:polygon(var(--notch) 0,calc(100% - var(--notch)) 0,100% var(--notch),100% calc(100% - var(--notch)),calc(100% - var(--notch)) 100%,var(--notch) 100%,0 calc(100% - var(--notch)),0 var(--notch))}
.frame>.core{background:var(--paper);clip-path:inherit;height:100%}
.btn{
  font-family:"Germania One",Impact,fantasy;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--paper);background:var(--ink);border:0;padding:7px 12px 6px;cursor:pointer;line-height:1;
  clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px);
  transition:background .15s,color .15s;
}
.btn:hover{background:var(--blood)}
.btn--ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn--ghost:hover{background:var(--ink);color:var(--paper)}
.btn:focus-visible{outline:2.5px solid var(--brass);outline-offset:3px}
.pill{display:inline-flex;align-items:center;gap:4px;font-family:"Germania One",Impact,fantasy;font-size:9px;letter-spacing:.13em;text-transform:uppercase;padding:2px 6px 1px;border:1.3px solid currentColor;line-height:1.3}
.pill--ready{color:var(--ink)}
.pill--expended{color:var(--ink-3);border-style:dashed}
.pill--lost{color:var(--paper);background:var(--lost);border-color:var(--lost)}
.pill--persist{color:var(--persist)}
.pill--talent{color:var(--brass);border-color:var(--brass)}
/* scroll regions — paper, not chrome */
.scroll{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--rule) var(--stripe)}
.scroll::-webkit-scrollbar{width:7px}
.scroll::-webkit-scrollbar-track{background:var(--stripe)}
.scroll::-webkit-scrollbar-thumb{background:var(--rule)}
.scroll::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
.scrollwrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.scrollwrap>.fade{position:absolute;left:0;right:7px;bottom:0;height:26px;pointer-events:none;opacity:0;transition:opacity .18s;
  background:linear-gradient(to top,var(--paper) 12%,rgba(243,237,225,0))}
.scrollwrap.more>.fade{opacity:1}

/* ============================================================
   TABS — index tabs along the inside bottom edge (they stay inside
   the window; nothing may overhang a VTT frame)
   ============================================================ */
.tabs{position:absolute;left:30px;right:16px;bottom:5px;height:27px;display:flex;gap:3px;z-index:8}
.tab{
  position:relative;flex:1;min-width:0;height:27px;padding:0 4px;border:0;cursor:pointer;
  background:var(--paper-2);color:var(--ink);
  font-family:"Germania One",Impact,fantasy;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;line-height:1;
  box-shadow:inset 0 1.6px 0 var(--paper-edge),0 1px 0 var(--paper-edge);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px));
  transition:background .16s,color .16s;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.tab u{text-decoration:none;font-size:8px;opacity:.5;font-family:"Markazi Text",serif}
.tab:hover{background:var(--stripe)}
.tab[aria-selected="true"]{background:var(--blood);color:var(--paper);box-shadow:inset 0 1.6px 0 var(--blood-2)}
.tab[aria-selected="true"] u{opacity:.6}
.tab--more{flex:.5;color:var(--ink-3)}
.tab:focus-visible{outline:2.5px solid var(--brass);outline-offset:-2px}

/* ============================================================
   CONDITIONS — the strip that drives the draw. Strengthen sets
   advantage (p.83); Muddle sets disadvantage (p.84).
   ============================================================ */
.conds{display:flex;flex-wrap:wrap;gap:3px;align-items:center;flex:none}
.cond{
  font-family:"Germania One",Impact,fantasy;font-size:9px;letter-spacing:.09em;text-transform:uppercase;line-height:1;
  padding:3px 6px 2px;border:1.3px solid var(--rule);background:transparent;color:var(--rule);cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;transition:all .13s;
}
.cond i{font-style:normal;font-size:9px}
.cond:hover{border-color:var(--ink-3);color:var(--ink-3)}
.cond[aria-pressed="true"]{border-color:var(--ink);color:var(--paper);background:var(--ink)}
.cond[aria-pressed="true"].cond--pos{background:var(--persist);border-color:var(--persist)}
.cond[aria-pressed="true"].cond--neg{background:var(--blood);border-color:var(--blood)}
.cond[aria-pressed="true"].cond--drive{box-shadow:0 0 0 1.6px var(--paper),0 0 0 3px var(--brass)}
.cond:focus-visible{outline:2.5px solid var(--brass);outline-offset:2px}
.cond b{font-family:"Markazi Text",serif;font-weight:700;font-size:11px}
.condnote{font-size:9.5px;line-height:12px;font-style:italic;color:var(--ink-3);flex:1;min-width:110px}
.condnote em{font-style:normal;font-family:"Germania One",Impact,fantasy;letter-spacing:.06em;text-transform:uppercase;font-size:9px;color:var(--blood)}
.condnote.flag{color:var(--blood)}

/* ============================================================
   DRAW CONTROLS — three equal buttons. The one the player's
   conditions already demand is armed; the other two are the
   GM-discretion overrides (p.73).
   ============================================================ */
.draws{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;flex:none}
.draw{
  font-family:"Germania One",Impact,fantasy;font-size:10px;letter-spacing:.08em;text-transform:uppercase;line-height:1.15;
  color:var(--ink);background:var(--paper);border:0;box-shadow:inset 0 0 0 1.5px var(--ink);
  padding:7px 3px 6px;cursor:pointer;text-align:center;position:relative;transition:background .14s,color .14s,box-shadow .14s;
  clip-path:polygon(5px 0,calc(100% - 5px) 0,100% 5px,100% calc(100% - 5px),calc(100% - 5px) 100%,5px 100%,0 calc(100% - 5px),0 5px);
}
.draw small{display:block;font-family:"Platypi",serif;font-style:italic;font-size:8px;letter-spacing:0;text-transform:none;color:var(--ink-3);margin-top:3px}
.draw:hover{background:var(--ink);color:var(--paper)}
.draw:hover small{color:var(--paper-edge)}
.draw[data-armed="true"]{background:var(--ink);color:var(--paper);box-shadow:inset 0 0 0 1.5px var(--ink),0 0 0 2px var(--brass)}
.draw[data-armed="true"] small{color:var(--brass-2)}
.draw[data-armed="true"][data-mode="advantage"]{background:var(--adv);box-shadow:inset 0 0 0 1.5px var(--adv),0 0 0 2px var(--brass)}
.draw[data-armed="true"][data-mode="disadvantage"]{background:var(--dis);box-shadow:inset 0 0 0 1.5px var(--dis),0 0 0 2px var(--brass)}
.draw[disabled]{opacity:.36;cursor:not-allowed;background:var(--paper);color:var(--ink-3);box-shadow:inset 0 0 0 1.5px var(--rule)}
.draw:focus-visible{outline:2.5px solid var(--brass);outline-offset:2px}
.ctx{display:flex;gap:3px;align-items:center;flex:none;font-family:"Germania One",Impact,fantasy;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.ctx button{font-family:inherit;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px 2px;border:1.3px solid var(--rule);background:transparent;color:var(--ink-3);cursor:pointer;line-height:1}
.ctx button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.ctx button:focus-visible{outline:2.5px solid var(--brass);outline-offset:1px}

/* ============================================================
   PROFILE
   ============================================================ */
.profile{display:grid;grid-template-columns:minmax(0,1fr) 196px;gap:16px;flex:1;min-height:0}
.bio{font-size:11px;line-height:15.2px;color:var(--ink-2);padding-right:8px}
.bio p{margin:0 0 5px;text-wrap:pretty}
.bio p:last-child{margin-bottom:2px}
.bio .lede{font-size:12.2px;line-height:16.6px;font-style:italic;color:var(--blood)}
.bio .beat{font-style:italic;color:var(--blood)}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.quest .core{padding:8px 10px}
.quest h3{margin:0 0 4px;font-family:"Germania One",Impact,fantasy;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.quest p{margin:0;font-family:"Germania One",Impact,fantasy;font-size:12.5px;line-height:15px;color:var(--blood)}
.quest small{display:block;margin-top:4px;font-style:italic;font-size:10px;line-height:13px;color:var(--ink-3)}
.bgs{display:flex;flex-direction:column;gap:5px}
.bgs--grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}
.bg{display:grid;grid-template-columns:1fr auto;gap:1px 8px;align-items:center;padding:5px 8px;
  background:var(--stripe);cursor:pointer;border-left:3px solid var(--ink);transition:opacity .15s}
.bg b{grid-column:1;grid-row:1;font-family:"Germania One",Impact,fantasy;font-weight:400;font-size:11.5px}
.bg small{grid-column:1;grid-row:2;font-size:9.5px;line-height:11.5px;color:var(--ink-3);font-style:italic}
.bg .pill{grid-column:2;grid-row:1/3;align-self:center;justify-self:end}
.bg[data-state="expended"]{opacity:.55;border-left-color:var(--rule)}
.bg[data-state="expended"] b{text-decoration:line-through;text-decoration-color:var(--rule)}
.bg:focus-visible{outline:2.5px solid var(--brass)}
.tokbig{width:100px;height:100px;align-self:center;margin-top:auto;padding:0;border:0;background:transparent;cursor:pointer}
.tokbig img{width:100px;height:100px;display:block;transition:filter .15s}
.tokbig:hover img{filter:drop-shadow(0 0 6px rgba(125,43,34,.5))}
.tokbig:focus-visible{outline:2.5px solid var(--brass);outline-offset:3px}
.notes{font-size:10.5px;line-height:14px;font-style:italic;color:var(--ink-3);
  background-image:repeating-linear-gradient(to bottom,transparent 0 13px,var(--rule-2) 13px 14px);min-height:70px}

/* ============================================================
   HAND — unprepared · round selection · discard over deck
   ============================================================ */
.hand{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;position:relative}
.table3{display:grid;grid-template-columns:126px minmax(0,1fr) 126px;gap:11px;align-items:start;flex:none}
.zone{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.zone__t{font-family:"Germania One",Impact,fantasy;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;display:flex;align-items:center;gap:6px;white-space:nowrap}
.zone__t::before,.zone__t::after{content:"";width:11px;height:1.5px;background:var(--ink)}
.zone__t i{width:4px;height:4px;background:var(--ink);transform:rotate(45deg);display:inline-block}
/* the pile count belongs in the section rule, not on top of the card art */
.zone__t b{font-family:"Markazi Text",serif;font-weight:700;font-size:15px;letter-spacing:0;line-height:1;color:var(--blood);font-variant-numeric:tabular-nums}
.zone__s{font-size:9px;line-height:11.5px;font-style:italic;color:var(--ink-3);text-align:center;max-width:126px;margin-bottom:2px}
.zone__s b{font-style:normal;font-family:"Germania One",Impact,fantasy;font-weight:400;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--blood)}
.zone--mid .zone__t{font-size:13px}
.zone--mid .zone__s{max-width:280px}

/* ---- the card ---- */
.kard{
  --tint:#3a2d3f;position:relative;display:flex;flex-direction:column;min-width:0;text-align:left;
  width:var(--w,92px);height:calc(var(--w,92px)*1.52);padding:3px;border:0;cursor:pointer;
  background:var(--ink);color:var(--paper);font-family:"Platypi",serif;
  box-shadow:inset 0 0 0 1.3px var(--brass),0 5px 11px -7px var(--shadow);
  clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px);
  transition:transform .18s,box-shadow .18s,opacity .18s,filter .18s;
}
.kard__init{position:absolute;left:5px;top:5px;z-index:2;width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  background:var(--paper);color:var(--ink);transform:rotate(45deg);border:1.5px solid var(--brass)}
.kard__init b{transform:rotate(-45deg);font-family:"Markazi Text",serif;font-weight:700;font-size:13px;line-height:1}
.kard__title{flex:none;text-align:center;font-family:"Germania One",Impact,fantasy;font-size:8.6px;letter-spacing:.02em;line-height:10px;padding:4px 4px 2px 34px;min-height:26px;display:flex;align-items:center;justify-content:center}
.kard__art{flex:none;height:calc(var(--w,92px)*.44);margin:0 2px;position:relative;overflow:hidden;
  background:var(--panel,none) center/cover no-repeat,#0f0d0c;box-shadow:inset 0 0 0 1px rgba(201,162,90,.45)}
.kard[data-panel="class"] .kard__art{--panel:var(--panel-class)}
.kard[data-panel="ancestry"] .kard__art{--panel:var(--panel-ancestry)}
.kard[data-panel="item"] .kard__art{--panel:var(--panel-item)}
/* the wash the source label reads against, over the sheet's diagonal hatch */
.kard__art::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(8,7,6,.9) 0,rgba(8,7,6,0) 30%),
             repeating-linear-gradient(135deg,rgba(255,255,255,.02) 0 2px,transparent 2px 6px)}
/* the source of the card, named — this replaces the generic CLASS/ANCESTRY
   tag that used to sit top-right and collide with long titles */
.kard__panel{position:absolute;left:5px;bottom:2px;z-index:2;white-space:nowrap;
  font-family:"Germania One",Impact,fantasy;font-size:6px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--brass-2);text-shadow:0 1px 2px rgba(0,0,0,.95)}
.kard--big .kard__panel{left:7px;bottom:3px;font-size:8px;letter-spacing:.14em}
.kard__box{flex:1 1 auto;min-height:0;margin:3px 2px 0;background:var(--paper);color:var(--ink);padding:3px 4px 2px;font-size:6.6px;line-height:7.9px;overflow:hidden;position:relative}
.kard__box b{display:block;text-align:center;font-family:"Germania One",Impact,fantasy;font-weight:400;font-size:6px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);margin-bottom:1px}
.kard__box b::before,.kard__box b::after{content:" ✦ ";color:var(--brass);font-size:6px;vertical-align:.5px}
.kard__box em{font-style:normal;font-family:"Germania One",Impact,fantasy;font-size:6px;letter-spacing:.09em;text-transform:uppercase;color:var(--blood)}
.kard__glyph{flex:none;height:13px;display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--brass-2)}
.kard__glyph span{width:13px;height:13px;display:flex;align-items:center;justify-content:center;background:#0f0d0c;border:1.1px solid var(--brass);transform:rotate(45deg) scale(.8)}
.kard__glyph span i{transform:rotate(-45deg);font-style:normal}
.kard__state{position:absolute;left:0;right:0;top:44%;z-index:3;display:none;justify-content:center}
.kard__state .pill{background:var(--paper);font-size:8px;padding:2px 7px 1px}
.kard--big{--w:176px}
.kard--big .kard__title{font-size:14px;line-height:15px;padding:7px 8px 6px 46px;min-height:38px}
.kard--big .kard__init{width:40px;height:40px;left:8px;top:8px}
.kard--big .kard__init b{font-size:20px}
.kard--big .kard__box{font-size:9.6px;line-height:11.6px;padding:6px 8px 5px}
.kard--big .kard__box b{font-size:8px;margin-bottom:3px}
.kard--big .kard__box em{font-size:8px}
.kard--big .kard__glyph{height:20px}
.kard--big .kard__glyph span{width:20px;height:20px;font-size:11px}
.kard--big .kard__art{height:60px}

/* ---- the initiative diamond as the SET control (Readied cards only) ---- */
.kard__init--btn{padding:0;cursor:pointer;transition:background .14s,box-shadow .14s,border-color .14s}
.kard__init--btn i{position:absolute;inset:0;display:none;align-items:center;justify-content:center;transform:rotate(-45deg);
  font-style:normal;font-family:"Germania One",Impact,fantasy;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase}
.kard__init--btn:hover{background:var(--blood);border-color:var(--brass-2)}
.kard__init--btn:hover b{display:none}
.kard__init--btn:hover i{display:flex;color:var(--paper)}
.kard__init--btn:focus-visible{outline:2.5px solid var(--brass);outline-offset:3px}
.kard--set .kard__init--btn{background:var(--blood);border-color:var(--brass-2);box-shadow:0 0 0 2px var(--brass),0 0 15px 2px rgba(201,162,90,.55)}
.kard--set .kard__init--btn b{color:var(--paper)}
.kard--dim .kard__init--btn{opacity:.55}
.kard__setflag{position:absolute;left:0;right:0;top:52px;z-index:3;display:none;justify-content:center;pointer-events:none}
.kard--set .kard__setflag{display:flex}
.kard__setflag span{font-family:"Germania One",Impact,fantasy;font-size:8px;letter-spacing:.2em;text-transform:uppercase;
  background:var(--brass);color:var(--ink);padding:2px 8px 1px;box-shadow:0 0 0 1.4px var(--ink)}
.kard--set{box-shadow:inset 0 0 0 1.3px var(--brass),0 0 0 2.5px var(--brass),0 0 26px 4px rgba(201,162,90,.55),0 11px 20px -11px var(--shadow)}
.setline{font-style:normal;display:inline-flex;align-items:baseline;gap:6px;font-family:"Germania One",Impact,fantasy;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.setline b{background:var(--brass);color:var(--ink);padding:2px 8px 1px;letter-spacing:.2em}
.setline em{font-style:normal;font-family:"Markazi Text",serif;font-size:17px;color:var(--blood);letter-spacing:0}
.setline span{font-family:"Platypi",serif;font-style:italic;font-size:10.5px;letter-spacing:0;text-transform:none;color:var(--ink-3)}
.kard:hover{transform:translateY(-5px)}
.kard[data-state="selected"]{opacity:.35;filter:grayscale(1)}
.kard[data-state="selected"]:hover{transform:none}
.kard[data-state="expended"]{opacity:.55;filter:saturate(.2)}
.kard[data-state="expended"] .kard__state,.kard[data-state="lost"] .kard__state,.kard[data-state="persistent"] .kard__state{display:flex}
.kard[data-state="lost"]{filter:brightness(.55) saturate(0)}
.kard[data-state="lost"] .kard__state .pill{background:var(--lost);color:var(--paper);border-color:var(--paper)}
.kard[data-state="persistent"]{box-shadow:inset 0 0 0 1.3px var(--brass),0 0 0 2px var(--persist),0 5px 11px -7px var(--shadow)}
.kard[data-state="persistent"] .kard__state .pill{color:var(--persist)}
.kard[data-state="expended"]:hover,.kard[data-state="lost"]:hover{transform:none}
.kard--talent{box-shadow:inset 0 0 0 1.3px var(--brass),inset 0 0 0 2.6px var(--ink),inset 0 0 0 3.6px var(--brass-2),0 5px 11px -7px var(--shadow)}
.kard--talent .kard__box b{color:var(--brass)}
.kard--glow{box-shadow:inset 0 0 0 1.3px var(--brass),0 0 0 2.5px rgba(201,162,90,.55),0 0 20px 3px rgba(201,162,90,.42),0 11px 20px -11px var(--shadow)}
.kard:focus-visible{outline:2.5px solid var(--brass);outline-offset:3px}

/* ---- round selection ---- */
.round{display:flex;gap:11px;justify-content:center;align-items:flex-start;min-height:268px;padding-top:3px}
/* the empty Readied slots are art now; their prompt text is inside the
   image, so it survives on the element only as an aria-label */
.slotcard{--w:176px;width:176px;height:268px;background:var(--slot-1) center/cover no-repeat;
  clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px)}
.slotcard--2{background-image:var(--slot-2)}
.round__foot{font-size:10px;font-style:italic;color:var(--ink-3);text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:5px;min-height:22px}
.round__foot .init{display:flex;gap:4px;align-items:center;font-style:normal}
.round__foot .init b{font-family:"Germania One",Impact,fantasy;font-weight:400;font-size:8.5px;letter-spacing:.15em;color:var(--ink-3)}
.round__foot .init button{font-family:"Markazi Text",serif;font-weight:700;font-size:15px;width:33px;height:24px;border:1.5px solid var(--ink);background:var(--paper);cursor:pointer;line-height:1}
.round__foot .init button[aria-pressed="true"]{background:var(--blood);color:var(--paper);border-color:var(--blood)}

/* ---- unprepared stack ---- */
.ustack{display:flex;flex-direction:column;width:124px}
.ustk{display:grid;grid-template-columns:22px 1fr;gap:5px;align-items:center;height:25px;padding:0 5px 0 3px;background:var(--ink);color:var(--paper);
  box-shadow:inset 0 0 0 1.1px var(--brass);margin-bottom:-4px;position:relative;cursor:pointer;border:0;text-align:left;width:100%;
  font-family:"Germania One",Impact,fantasy;font-size:8.6px;letter-spacing:.02em;
  transform-origin:left center;transition:transform .16s,background .13s,box-shadow .16s;
  clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% 100%,0 100%,0 4px)}
.ustk:last-child{margin-bottom:0;clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px)}
.ustk b{width:18px;height:18px;display:flex;align-items:center;justify-content:center;background:var(--blood);color:var(--paper);transform:rotate(45deg) scale(.82);font-family:"Markazi Text",serif;font-weight:700;font-size:10.5px}
.ustk b i{transform:rotate(-45deg);font-style:normal}
.ustk small{display:block;font-family:"Platypi",serif;font-size:6.4px;letter-spacing:.07em;color:var(--brass-2);text-transform:uppercase}
.ustk--anc{box-shadow:inset 0 0 0 1.1px var(--persist)}
/* the chip floats and zooms where it sits — no card overlay. Origin is the
   left edge so it grows into the page rather than off it, and nothing here
   changes a font-size, so none of it can trip the 6px clamp. */
.ustk:hover,.ustk:focus-visible{background:var(--blood-2);z-index:5;transform:scale(1.55);
  box-shadow:inset 0 0 0 1.1px var(--brass),0 7px 18px -7px var(--shadow)}
.ustk--anc:hover,.ustk--anc:focus-visible{box-shadow:inset 0 0 0 1.1px var(--persist),0 7px 18px -7px var(--shadow)}
.ustk:focus-visible{outline:2.5px solid var(--brass);outline-offset:-1px}
.ustk[data-picked="true"]{background:var(--brass);color:var(--ink)}
.ustk[data-picked="true"] small{color:var(--ink-2)}
/* the three rests the book distinguishes (p.67) — hover each for what it resets */
.rests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;width:126px;margin-top:8px}
.rests .btn{font-size:8px;letter-spacing:.05em;padding:5px 1px 4px}
.rests .btn[data-on="true"]{background:var(--persist);color:var(--paper);box-shadow:none}
.rests .btn[data-on="true"]:hover{background:var(--blood)}

/* ---- hand-page deck column: DISCARD on top, DECK beneath ---- */
.minidisc{width:96px;height:78px;border:1.5px dashed var(--rule);display:flex;align-items:center;justify-content:center;padding:5px;
  clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px)}
.minidisc .mc{width:100%}
.minidisc .mc__rank{font-size:15px;justify-content:center}
.minidisc .mc__rank .suit{font-size:13px}
.minidisc .mc__vals{gap:3px;margin-top:3px}
.minidisc .mc__v{padding:1px}
.minidisc .mc__v b{font-size:13px}
.minidisc .mc__v span{font-size:6px;letter-spacing:.08em}
.minidisc .mc__foot{display:none}
.minidisc .empty{font-size:9px;font-style:italic;color:var(--ink-3)}
/* empty state only — once a card is drawn this box shows that card's face */
.minidisc--empty{background:var(--discard-empty) center/contain no-repeat;border-style:solid;border-color:var(--rule-2)}
.minidisc--empty .empty{display:none}
.minideck{position:relative;width:112px;height:154px;cursor:pointer}
.minideck i{position:absolute;inset:0;background:var(--card-back) center/cover no-repeat,#0f0d0c;border:2px solid var(--ink);
  clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px)}
.minideck i:nth-child(1){transform:translate(4px,4px)}
.minideck i:nth-child(2){transform:translate(2px,2px)}
/* count rides the corner — the middle of the deck belongs to the pills now */
/* the three pills sit ON the deck: the deck IS the control */
.deckpills{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;display:flex;flex-direction:column;gap:4px}
.dpill{
  font-family:"Germania One",Impact,fantasy;font-size:8.6px;letter-spacing:.09em;text-transform:uppercase;line-height:1;
  padding:5px 3px 4px;border:0;background:rgba(18,17,15,.88);color:var(--paper-edge);cursor:pointer;
  box-shadow:inset 0 0 0 1.3px var(--brass);text-align:center;
  clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px);
  transition:background .14s,color .14s,box-shadow .14s;
}
.dpill:hover{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1.3px var(--ink)}
.dpill[data-armed="true"]{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1.3px var(--ink),0 0 0 2px var(--brass)}
.dpill[data-armed="true"][data-mode="advantage"]{background:var(--adv);color:var(--paper);box-shadow:inset 0 0 0 1.3px var(--adv),0 0 0 2px var(--brass)}
.dpill[data-armed="true"][data-mode="disadvantage"]{background:var(--dis);color:var(--paper);box-shadow:inset 0 0 0 1.3px var(--dis),0 0 0 2px var(--brass)}
.dpill[disabled]{opacity:.38;cursor:not-allowed;background:rgba(18,17,15,.55);box-shadow:inset 0 0 0 1.3px var(--rule)}
.dpill:focus-visible{outline:2.5px solid var(--brass);outline-offset:2px}
.deckcol{display:flex;flex-direction:column;align-items:center;gap:4px;width:126px}
.deckcol .ctx{margin-top:5px;justify-content:center}

/* ---- prepared hand ---- */
.fan{display:flex;justify-content:center;align-items:flex-end;gap:6px;padding:7px 0 8px;flex:none}
.fan .kard{--w:104px;transition:transform .16s,box-shadow .16s}
.fan .kard:nth-child(1){transform:rotate(-6deg) translateY(9px)}
.fan .kard:nth-child(2){transform:rotate(-3.5deg) translateY(4px)}
.fan .kard:nth-child(3){transform:rotate(-1.2deg)}
.fan .kard:nth-child(4){transform:rotate(1.2deg)}
.fan .kard:nth-child(5){transform:rotate(3.5deg) translateY(4px)}
.fan .kard:nth-child(6){transform:rotate(6deg) translateY(9px)}
.hand .fan .kard:hover{transform:translateY(-6px) rotate(0)}
/* Quick Breath: a Skill you still hold becomes healing you may spend (p.67).
   Click toggles it into the total; nothing resolves until Breath is pressed
   again, so the whole set is one decision rather than a run of small ones. */
.hand .fan .kard[data-heal]{box-shadow:inset 0 0 0 1.3px var(--brass),0 0 0 2px var(--persist),0 5px 11px -7px var(--shadow)}
.hand .fan .kard[data-heal]::after{
  content:"Heal " attr(data-heal);position:absolute;left:0;right:0;top:40%;z-index:4;
  font-family:"Germania One",Impact,fantasy;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
  text-align:center;color:var(--persist);background:rgba(243,237,225,.94);padding:6px 0 5px;
  box-shadow:0 -1.4px 0 var(--persist),0 1.4px 0 var(--persist)}
.hand .fan .kard[data-chosen="true"]{box-shadow:inset 0 0 0 1.3px var(--brass),0 0 0 3px var(--persist),0 0 22px 4px rgba(63,106,82,.6)}
.hand .fan .kard[data-chosen="true"]::after{color:var(--paper);background:var(--persist);box-shadow:0 -1.4px 0 var(--paper),0 1.4px 0 var(--paper)}
.hand.breathing .fan .kard:not([data-heal]){opacity:.35;filter:grayscale(1)}
/* the running total, dead centre of the Readied area */
.zone--mid{position:relative}
.hand.breathing .round{opacity:.15}
.hand.breathing .round__foot{visibility:hidden}
.healtot{position:absolute;left:0;right:0;top:26px;height:268px;z-index:12;display:none;
  flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.hand.breathing .healtot{display:flex}
.healtot>b{font-family:"Markazi Text",serif;font-weight:700;font-size:92px;line-height:.86;color:var(--persist);
  text-shadow:0 0 3px var(--paper),0 0 26px rgba(63,106,82,.5);font-variant-numeric:tabular-nums}
/* the total is the readout; this is the control that spends it. pointer-events
   comes back on just for the button, since .healtot itself must stay inert. */
.healbtn{pointer-events:auto;margin-top:6px;cursor:pointer;border:0;line-height:1;
  font-family:"Germania One",Impact,fantasy;font-size:13px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--paper);background:var(--persist);padding:8px 24px 7px;
  clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px);
  box-shadow:0 4px 12px -4px rgba(63,106,82,.85);transition:background .14s}
.healbtn:hover{background:var(--blood)}
.healbtn:focus-visible{outline:2.5px solid var(--brass);outline-offset:3px}
.healtot small{font-family:"Platypi",serif;font-style:italic;font-size:10.5px;line-height:14px;color:var(--ink-3);margin-top:10px;max-width:250px}
.healtot small b{font-family:"Germania One",Impact,fantasy;font-weight:400;font-style:normal;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--persist);text-shadow:none}

/* PEEK — hovering a prepared card shows it full size as an overlay that is
   a REAL Readied card: same kard() call, same .kard--big class, no transform.

   ⚠ do not go back to scaling a small card up. Blink clamps any computed
   font-size below 6px, and .kard--big's face divided by the 176/104 ratio
   lands at 5.67 / 4.73 / 4.14px — all three snap back to 6px and are then
   multiplied by the scale, so the "matching" card renders LARGER than the
   card it matches, and its source label collides with its title. Nothing
   in this sheet may declare a font-size under 6px for the same reason. */
.peek{position:absolute;z-index:40;pointer-events:none;display:none}
.peek.on{display:block}
.peek .kard{opacity:1;filter:none;                       /* read a lost card too */
  box-shadow:inset 0 0 0 1.3px var(--brass),0 0 0 1.4px var(--ink),0 16px 30px -8px var(--shadow)}
/* a Readied card never carries a state stamp, so this is the one thing the
   overlay has to place itself — on the art, clear of the rules text */
.peek .kard__state{top:64px}
.talrow{display:flex;gap:6px;justify-content:center;align-items:center;flex:none;flex-wrap:wrap}
.tal{display:grid;grid-template-columns:20px 1fr;gap:5px;align-items:center;min-width:134px;height:34px;padding:0 8px 0 5px;background:var(--ink);color:var(--paper);cursor:pointer;border:0;text-align:left;
  box-shadow:inset 0 0 0 1.1px var(--brass),inset 0 0 0 2.4px var(--ink),inset 0 0 0 3.3px var(--brass-2);
  font-family:"Germania One",Impact,fantasy;font-size:9px;letter-spacing:.02em;
  clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px);transition:transform .16s}
.tal:hover{transform:translateY(-3px)}
.tal b{width:17px;height:17px;display:flex;align-items:center;justify-content:center;background:var(--brass);color:var(--ink);transform:rotate(45deg) scale(.82);font-family:"Markazi Text",serif;font-weight:700;font-size:10px}
.tal b i{transform:rotate(-45deg);font-style:normal}
.tal small{display:block;font-family:"Platypi",serif;font-size:6.4px;letter-spacing:.07em;color:var(--brass-2);text-transform:uppercase;font-style:italic}
.tal--passive{cursor:default}
.tal--passive b{background:transparent;color:var(--brass);box-shadow:inset 0 0 0 1.1px var(--brass)}
.tal[data-state="selected"]{box-shadow:inset 0 0 0 1.1px var(--brass),0 0 0 2px var(--brass-2),0 0 11px 2px rgba(201,162,90,.5)}
.tal:focus-visible{outline:2.5px solid var(--brass);outline-offset:2px}

/* ============================================================
   DECK
   ============================================================ */
.deck{display:grid;grid-template-columns:minmax(0,1fr) 226px;gap:16px;flex:1;min-height:0}
.deck .side{min-width:0}
.table{display:flex;flex-direction:column;gap:9px;min-width:0}
.felt{flex:none;display:grid;grid-template-columns:88px minmax(0,1fr) 88px;gap:8px;align-items:center;padding:11px 10px;background:var(--stripe)}
.pile{position:relative;width:82px;height:114px;margin:0 auto}
.pile i{position:absolute;inset:0;background:var(--card-back) center/cover no-repeat,#0f0d0c;border:2px solid var(--ink);
  clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px)}
.pile i:nth-child(1){transform:translate(3px,3px)}
.pile i:nth-child(2){transform:translate(1.5px,1.5px)}
.pile__back{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--card-back) center/cover no-repeat,#0f0d0c;border:2px solid var(--ink);align-items:flex-end;justify-content:flex-end;padding:5px;
  clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px)}
.pile__lbl{text-align:center;margin-top:6px;font-family:"Germania One",Impact,fantasy;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:baseline;justify-content:center;gap:6px}
.pile__lbl b{font-family:"Markazi Text",serif;font-weight:700;font-size:15px;letter-spacing:0;color:var(--blood);font-variant-numeric:tabular-nums}
.pile--discard[data-empty="true"] .pile__back,.pile--discard[data-empty="true"] i{background:var(--discard-empty) center/cover no-repeat,#0f0d0c}
.pile--discard i{opacity:.6}
.flip{perspective:900px;width:104px;height:146px;margin:0 auto}
.flip__in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.6,.05,.3,1)}
.flip.show .flip__in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:2px solid var(--ink);background:var(--paper);
  clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px)}
.face--back{background:var(--card-back) center/cover no-repeat,#0f0d0c}
.face--front{transform:rotateY(180deg);display:flex;flex-direction:column;padding:8px}
.mc{display:flex;flex-direction:column;height:100%}
.mc__rank{font-family:"Platypi",serif;font-weight:800;font-size:22px;line-height:1;display:flex;align-items:center;gap:4px}
.mc__rank .suit{font-size:19px}
.mc__vals{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:5px}
.mc__v{text-align:center;border:1.3px solid var(--ink);padding:4px 2px 3px}
.mc__v span{display:block;font-family:"Germania One",Impact,fantasy;font-size:6.6px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.mc__v b{font-family:"Markazi Text",serif;font-weight:700;font-size:22px;line-height:1;color:var(--blood)}
.mc--crit .mc__rank,.mc--null .mc__rank{font-family:"Germania One",Impact,fantasy;font-weight:400;font-size:18px;letter-spacing:.05em}
.mc--bless .mc__rank{color:var(--persist)}
.mc--curse .mc__rank{color:var(--blood)}
.mc__foot{font-size:8px;font-style:italic;color:var(--ink-3);text-align:center;margin-top:5px;line-height:10px}
.pair{display:flex;gap:5px;justify-content:center;align-items:center;flex:none;min-height:52px}
.pairc{width:40px;border:1.3px solid var(--rule);background:var(--paper);padding:3px 2px;text-align:center;position:relative;opacity:.55}
.pairc b{display:block;font-family:"Platypi",serif;font-weight:800;font-size:12px;line-height:1.1}
.pairc small{display:block;font-family:"Markazi Text",serif;font-size:11px;color:var(--ink-3);line-height:1.1}
.pairc.kept{opacity:1;border-color:var(--ink);border-width:2px;box-shadow:0 0 0 2px var(--brass)}
.pairc.kept::after{content:"KEPT";position:absolute;left:0;right:0;bottom:-13px;font-family:"Germania One",Impact,fantasy;font-size:6.5px;letter-spacing:.14em;color:var(--brass)}
.pairlbl{font-size:9.5px;font-style:italic;color:var(--ink-3);max-width:170px;line-height:12px}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.count{text-align:center;padding:6px 3px;border:1.5px solid var(--ink)}
.count span{display:block;font-family:"Germania One",Impact,fantasy;font-size:7.6px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.count b{font-family:"Markazi Text",serif;font-weight:700;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.count small{display:block;font-size:8px;color:var(--ink-3);font-style:italic}
.pips{display:flex;gap:2px;justify-content:center;margin-top:2px}
.pips i{width:7px;height:7px;border:1.2px solid var(--ink);transform:rotate(45deg)}
.pips i.on{background:var(--persist);border-color:var(--persist)}
.pips--curse i.on{background:var(--blood);border-color:var(--blood)}
.log{flex:1;min-height:0;font-size:10.5px;line-height:14px;padding-right:6px}
.log div{padding:4px 0;border-bottom:1px solid var(--rule-2);display:flex;gap:7px;align-items:baseline}
.log div b{font-family:"Markazi Text",serif;font-weight:700;font-size:14px;min-width:32px;color:var(--blood)}
.log div small{color:var(--ink-3);font-style:italic;margin-left:auto;white-space:nowrap;font-size:9px}
.perks{display:flex;flex-direction:column;gap:0}
.perk{display:grid;grid-template-columns:22px 1fr;gap:7px;align-items:center;padding:4px 0;border-bottom:1px solid var(--rule-2);font-size:10.5px;line-height:13px}
.perk .n{font-family:"Markazi Text",serif;font-weight:700;font-size:14px;color:var(--blood);text-align:center;border:1.4px solid var(--blood);line-height:17px}
.perk small{display:block;font-size:8.6px;color:var(--ink-3);font-style:italic}
.comp{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px}
.comp i{height:18px;border:1.1px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:"Markazi Text",serif;font-weight:700;font-size:10px;font-style:normal;background:var(--paper)}
.comp i.minus{background:var(--stripe)}
.comp i.plus{background:var(--ink);color:var(--paper)}
.comp i.x{background:var(--blood);color:var(--paper);font-family:"Germania One",Impact,fantasy;font-weight:400;font-size:8px}
.comp i.nul{background:var(--rule-2);font-family:"Germania One",Impact,fantasy;font-weight:400;font-size:7px}
.comp i.bl{background:var(--persist);color:var(--paper);font-family:"Germania One",Impact,fantasy;font-weight:400;font-size:7px}
.comp i.cu{background:var(--blood-2);color:var(--paper);font-family:"Germania One",Impact,fantasy;font-weight:400;font-size:7px}
.note{font-size:9.5px;font-style:italic;color:var(--ink-3);line-height:13px}

/* ============================================================
   STATS
   ============================================================ */
.stats{display:flex;flex-direction:column;gap:7px;flex:1;min-height:0}
.hexes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;flex:none}
.hex{position:relative;border:0;background:transparent;padding:0;cursor:pointer;text-align:center}
.hex svg{width:100%;height:auto;display:block}
.hex b{position:absolute;left:0;right:0;top:15%;font-family:"Markazi Text",serif;font-weight:700;font-size:30px;line-height:1;color:var(--blood)}
.hex span{display:block;margin-top:2px;font-family:"Germania One",Impact,fantasy;font-size:10.5px;letter-spacing:.02em}
.hex small{display:block;font-family:"Platypi",serif;font-style:italic;font-size:8.4px;line-height:10px;color:var(--ink-3)}
.hex:hover b{transform:scale(1.08)}
.hex:focus-visible{outline:2.5px solid var(--brass);outline-offset:3px}
.test{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:8px 11px;
  background:var(--stripe);border-left:3px solid var(--blood);min-height:52px;flex:none}
.test .eq{font-family:"Markazi Text",serif;font-weight:700;font-size:22px;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.test .eq small{font-family:"Germania One",Impact,fantasy;font-weight:400;font-size:7.6px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);display:block}
.test .eq .op{color:var(--ink-3);font-size:17px}
.test .eq .tot{color:var(--blood);font-size:29px}
.test .res{font-family:"Germania One",Impact,fantasy;font-size:13px;letter-spacing:.09em;text-transform:uppercase;padding:5px 10px;color:var(--paper);background:var(--ink);white-space:nowrap}
.test .res.ok{background:var(--persist)}
.test .res.no{background:var(--blood)}
.test .tn{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--ink-3)}
.test .tn input{width:38px;font-family:"Markazi Text",serif;font-weight:700;font-size:16px;text-align:center;border:1.4px solid var(--ink);background:var(--paper);padding:1px}
.test__hint{font-size:10px;line-height:13px;font-style:italic;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0}
.grid2>div{display:flex;flex-direction:column;gap:7px;min-height:0}
.lvl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lvl .count b{font-size:18px}
.facs{display:flex;flex-direction:column;gap:3px}
.fac{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:10.5px;padding:3px 0;border-bottom:1px solid var(--rule-2)}
.fac b{font-family:"Germania One",Impact,fantasy;font-weight:400;font-size:11px;letter-spacing:.01em}
.fac.active b::after{content:" ✦";color:var(--brass)}
.tiers{display:flex;gap:2px;align-items:center}
.tiers i{width:13px;height:13px;border:1.4px solid var(--ink);border-radius:50%;font-family:"Markazi Text",serif;font-weight:700;font-size:8px;display:flex;align-items:center;justify-content:center;font-style:normal;color:var(--ink-3)}
.tiers i.on{background:var(--ink);color:var(--paper)}
.tiers i.cur{box-shadow:0 0 0 1.4px var(--paper),0 0 0 2.6px var(--blood);color:var(--blood);background:var(--paper)}
.tiers i.skull{border-color:var(--rule);color:var(--rule);margin-left:3px}
.tiers i.hostile{background:var(--blood);border-color:var(--blood);color:var(--paper)}
.tally{font-family:"Markazi Text",serif;font-size:10px;color:var(--ink-3);min-width:38px;text-align:right}

/* ============================================================
   INVENTORY
   ============================================================ */
.inv{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0}
.inv>div{display:flex;flex-direction:column;gap:7px;min-height:0}
.slots{display:flex;flex-direction:column;gap:5px}
.slot{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:5px 8px 5px 0;border-bottom:1px solid var(--rule-2)}
.slot__k{font-family:"Germania One",Impact,fantasy;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.slot__n{font-family:"Germania One",Impact,fantasy;font-size:11.5px;letter-spacing:.01em}
.slot__n small{display:block;font-family:"Platypi",serif;font-size:9px;font-style:italic;color:var(--ink-3);letter-spacing:0;line-height:11px}
.slot--empty .slot__n{color:var(--rule);font-style:italic;font-family:"Platypi",serif;font-size:10.5px}
.slot--small .slot__k{color:var(--brass)}
.carry{display:flex;flex-direction:column;gap:0}
.item{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--rule-2);font-size:10.5px}
.item b{font-family:"Germania One",Impact,fantasy;font-weight:400;font-size:11.5px;letter-spacing:.01em}
.item small{display:block;font-size:9px;font-style:italic;color:var(--ink-3);line-height:11px}
.item .w{font-family:"Markazi Text",serif;font-weight:700;color:var(--ink-3);font-size:12px}
.cap{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--ink-3);font-style:italic}
.cap .bar{flex:1;height:6px;background:var(--stripe);position:relative}
.cap .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);width:var(--p)}
.company{padding:8px 10px;background:var(--stripe);font-size:10.5px;display:flex;align-items:center;gap:10px;line-height:13px}
.company b{font-family:"Germania One",Impact,fantasy;font-weight:400;letter-spacing:.07em;text-transform:uppercase;font-size:10px;white-space:nowrap}

/* toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--paper);
  padding:9px 14px;font-size:11.5px;line-height:15px;font-family:"Platypi",serif;z-index:50;transition:opacity .2s,transform .2s;pointer-events:none;max-width:520px;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.flip__in,.kard,.tab,.draw{transition:none}}

    'Her greatest weakness is food.',
    'Her second greatest weakness is attention.',

   CONDITIONS (p.82–84). Only two of them touch the draw, and the
   book is explicit about both, so the sheet can arm the right
   button without ever guessing:
     Strengthen — "your actions gain advantage" (p.83)
     Muddle     — "your actions gain disadvantage" (p.84)
   Pacify and Stun forbid the action outright (p.84).
   ============================================================ */
const CONDS = [
  ['bless','Bless','+',1,'A Bless card is shuffled into your deck. Drawn, treat it as a Critical, then return it to the supply — and do NOT reshuffle (p.83).'],
  ['invisible','Invisible','◌',1,'Enemies cannot target you; non-targeted abilities still land (p.83).'],
  ['regenerate','Regenerate','❋',1,'Heal 1 at the start of your turn. Resolves before Wound (p.83).'],
  ['safeguard','Safeguard','⛊',1,'Prevents the next negative condition from any source (p.83).'],
  ['strengthen','Strengthen','▲',1,'Your actions gain advantage: draw two, apply the better (p.83).'],
  ['ward','Ward','◈',1,'Halve the next damage you suffer, rounded up (p.83).'],
  ['curse','Curse','−',0,'A Curse card is shuffled into your deck. Drawn, treat it as a Null, then return it to the supply — and do NOT reshuffle (p.83).'],
  ['immobilize','Immobilize','⊘',0,'No movement abilities. Forced movement still applies (p.84).'],
  ['muddle','Muddle','▼',0,'Your actions gain disadvantage: draw two, apply the worse (p.84).'],
  ['pacify','Pacify','☮',0,'You cannot perform any attack abilities (p.84).'],
  ['poison','Poison','☠',0,'All attacks that target you gain +1 attack (p.84).'],
  ['stun','Stun','✖',0,'You cannot use items or perform any abilities (p.84).'],
  ['wound','Wound','✚',0,'Suffer 1 damage at the end of your turn each round (p.84).'],
];
const CONDMAP = Object.fromEntries(CONDS.map(c=>[c[0],c]));
const cond = new Set(recall('conds',['strengthen']));           // fixture: Treat opens Strengthened
let ctxMode = recall('ctx','attack');                            // attack | test — the two-values-per-card fork

/* the mode the player's own state already demands */
function autoMode(){
  const s=cond.has('strengthen'), m=cond.has('muddle');
  if(s&&m) return {mode:'normal',flag:true,why:'Strengthen <em>and</em> Muddle are both on you. The draft never says they cancel — <em>GM decides</em> (p.63).'};
  if(s) return {mode:'advantage',why:'Strengthen is on you — advantage is automatic (p.83).'};
  if(m) return {mode:'disadvantage',why:'Muddle is on you — disadvantage is automatic (p.84).'};
  return {mode:'normal',why:'Nothing is changing your draw. The GM may still grant advantage or disadvantage for cover, elevation, stealth or surprise (p.73).'};
}
/* conditions that forbid the action outright */
function blocker(ctx){
  if(cond.has('stun')) return 'Stun — you cannot use items or perform any abilities (p.84).';
  if(ctx==='attack'&&cond.has('pacify')) return 'Pacify — you cannot perform any attack abilities (p.84).';
  return null;
}
function condStrip(){
  const a=autoMode(), blk=blocker(ctxMode);
  const chip=c=>{
    const [id,n,g,pos]=c, on=cond.has(id);
    const drive=(id==='strengthen'||id==='muddle')&&on?' cond--drive':'';
    const count=id==='bless'?deck.bless:id==='curse'?deck.curse:null;
    return `<button class="cond cond--${pos?'pos':'neg'}${drive}" data-cond="${id}" aria-pressed="${on}" title="${c[4]}"><i>${g}</i>${n}${count?`<b>${count}</b>`:''}</button>`;
  };
  return `${sec('Conditions','click to apply')}
    <div class="conds">${CONDS.map(chip).join('')}</div>
    <div class="conds" style="margin-top:2px"><div class="condnote ${a.flag||blk?'flag':''}">${blk?`<em>Blocked:</em> ${blk}`:a.why}</div></div>`;
}
function wireConds(el){
  $$('[data-cond]',el).forEach(b=>b.addEventListener('click',e=>{
    const id=b.dataset.cond;
    if(id==='bless'||id==='curse'){
      if(e.shiftKey){ if(!shedTemp(id)) toast(`No ${CONDMAP[id][1]} cards to shed.`); }
      else if(!gainTemp(id)) toast(`Already at six ${CONDMAP[id][1]} cards — ignore any more you would gain (p.83).`);
    } else {
      cond.has(id)?cond.delete(id):cond.add(id);
      toast(`<b>${CONDMAP[id][1]}</b> — ${CONDMAP[id][4]}`);
    }
    store('conds',[...cond]); repaint();
  }));
}

/* ============================================================
   THE DECK — the engine (p.62). Two values per card, and which one
   matters depends on whether you are attacking or testing.
   ============================================================ */
const deck={draw:[],discard:[],bless:0,curse:0,last:null,pair:null,log:[]};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function resetDeck(){deck.draw=shuffle(BASE.map(c=>({r:c[0],s:c[1],attr:c[2],atk:c[3]})));deck.discard=[];deck.last=null;deck.pair=null;deck.bless=0;deck.curse=0;}
resetDeck();
function gainTemp(kind){                       // p.83 — max six, shuffled straight in
  const n=kind==='bless'?deck.bless:deck.curse;
  if(n>=6) return false;
  const card=kind==='bless'?{r:'BL',s:'✦',attr:'crit',atk:'×2',temp:'bless'}:{r:'CU',s:'✦',attr:'null',atk:'null',temp:'curse'};
  deck.draw.splice(Math.floor(Math.random()*(deck.draw.length+1)),0,card);
  kind==='bless'?deck.bless++:deck.curse++; cond.add(kind);
  toast(`${kind==='bless'?'Bless':'Curse'} shuffled in — ${n+1} of 6. Drawn, it resolves as a ${kind==='bless'?'Critical':'Null'} and returns to the supply <em>without</em> a reshuffle (p.83).`);
  return true;
}
function shedTemp(kind){
  const before=deck.draw.length;
  deck.draw=deck.draw.filter(c=>c.temp!==kind);
  const gone=before-deck.draw.length; if(!gone&&!(kind==='bless'?deck.bless:deck.curse)) return false;
  kind==='bless'?deck.bless=0:deck.curse=0; cond.delete(kind);
  toast(`All ${kind==='bless'?'Bless':'Curse'} cards returned to the supply — this is what a Full Rest does (p.83).`);
  return true;
}
function pull(){
  if(!deck.draw.length){deck.draw=shuffle(deck.discard);deck.discard=[];toast('Draw pile empty — the discard pile was shuffled back in.');}
  return deck.draw.pop();
}
/* which of two cards is "better" depends on the column you are reading */
const rankOf=(c,ctx)=>{
  if(c.temp==='bless'||c.r==='B') return 99;
  if(c.temp==='curse'||c.r==='R') return -99;
  return ctx==='attack'?c.atk:c.attr;
};
function settle(cards){
  let reshuffle=false;
  for(const c of cards){
    if(c.temp){ c.temp==='bless'?deck.bless--:deck.curse--;         // "return it to the supply, but do
      if(!deck.bless) cond.delete('bless'); if(!deck.curse) cond.delete('curse'); //  not reshuffle" (p.83)
      continue; }
    deck.discard.push(c);
    if(c.r==='B'||c.r==='R') reshuffle=true;                        // p.62 — the real Crit/Null do reshuffle
  }
  if(reshuffle){deck.draw=shuffle([...deck.draw,...deck.discard]);deck.discard=[];}
  return reshuffle;
}
/* the one entry point every draw on every page goes through */
function resolveDraw(mode,ctx=ctxMode){
  const blk=blocker(ctx);
  if(blk){toast(blk);return null;}
  let cards,kept,tie=false;
  if(mode==='normal'){cards=[pull()];kept=cards[0];}
  else{
    cards=[pull(),pull()];
    const ra=rankOf(cards[0],ctx),rb=rankOf(cards[1],ctx);
    if(ra===rb){kept=cards[0];tie=true;}
    else kept=(mode==='advantage'?ra>rb:ra<rb)?cards[0]:cards[1];
  }
  const reshuffled=settle(cards);
  deck.last=kept; deck.pair=cards.length>1?{cards,kept,mode}:null;
  deck.log.unshift({lbl:label(kept),txt:readout(kept,ctx),mode,ctx,tie,
    t:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
  deck.log.length=Math.min(deck.log.length,40);
  store('conds',[...cond]);
  return {cards,kept,mode,ctx,tie,reshuffled};
}
const label=c=>c.temp==='bless'?'Bless':c.temp==='curse'?'Curse':c.r==='B'?'Crit':c.r==='R'?'Null':`${c.r}${c.s}`;
const readout=(c,ctx)=>
  c.temp==='bless'||c.r==='B' ? (ctx==='attack'?'attack damage doubles':'critical success')
  : c.temp==='curse'||c.r==='R' ? (ctx==='attack'?'hits for 0 damage':'critical failure')
  : ctx==='attack' ? `attack ${c.atk>0?'+':''}${c.atk}` : `attribute +${c.attr}`;
function announce(r){
  if(!r)return;
  const {kept,mode,ctx,tie,reshuffled,cards}=r;
  const two=cards.length>1?`Drew ${cards.map(label).join(' and ')} — kept the ${mode==='advantage'?'better':'worse'} (p.63). `:'';
  const tieNote=tie?'<em>Tied</em> — "if there is any disagreement or uncertainty about which card is better or worse, the GM decides" (p.63). ':'';
  const re=reshuffled?' The discard pile shuffles back in (p.62).':'';
  toast(`${two}${tieNote}<b>${label(kept)}</b> — ${readout(kept,ctx)}.${re}`);
}

/* ---- the three buttons: same size, all live, one already armed ---- */

  const b=(mode,name,sub)=>`<button class="draw" data-draw="${mode}" data-mode="${mode}" data-armed="${a.mode===mode}" ${blk?'disabled':''}
    title="${blk||(a.mode===mode?'Armed by your conditions — '+a.why.replace(/<[^>]+>/g,''):'Manual override; the GM may grant this for cover, elevation, stealth or surprise (p.73)')}">${name}<small>${a.mode===mode?sub[1]:sub[0]}</small></button>`;
  return `<div class="draws">
    ${b('normal','Draw',['one card','one card'])}
    ${b('advantage','Advantage',['two, keep better','armed · Strengthen'])}
    ${b('disadvantage','Disadvantage',['two, keep worse','armed · Muddle'])}

}

function deckPills(){

function ctxBar(){

    <button data-ctx="attack" aria-pressed="${ctxMode==='attack'}" title="Compare the attack modifier — the big number in the circle (p.62).">Attack</button>

}
function wireDraws(el,after){
  $$('[data-draw]',el).forEach(b=>b.addEventListener('click',()=>{
    const r=resolveDraw(b.dataset.draw); announce(r); if(r)(after||repaint)(r);
  }));
  $$('[data-ctx]',el).forEach(b=>b.addEventListener('click',()=>{ctxMode=b.dataset.ctx;store('ctx',ctxMode);repaint();}));
}

function cardFace(c){
  if(!c)return'';
  const bless=c.temp==='bless',curse=c.temp==='curse';
  const cls=bless?'mc mc--bless':curse?'mc mc--curse':c.r==='B'?'mc mc--crit':c.r==='R'?'mc mc--null':'mc';
  const title=bless?'Bless':curse?'Curse':c.r==='B'?'Critical':c.r==='R'?'Null':`${c.r}<span class="suit">${c.s}</span>`;
  const attr=bless||c.r==='B'?'Crit':curse||c.r==='R'?'—':c.attr;
  const atk =bless||c.r==='B'?'×2':curse||c.r==='R'?'Null':(c.atk>0?'+':'')+c.atk;
  const foot=bless||curse?'returns to supply · no reshuffle (p.83)':(c.r==='B'||c.r==='R')?'discard pile shuffles back in (p.62)':'';
  return `<div class="${cls}"><div class="mc__rank">${title}</div>
    <div class="mc__vals"><div class="mc__v"><span>Attribute</span><b>${attr}</b></div><div class="mc__v"><span>Attack</span><b>${atk}</b></div></div>
    ${foot?`<div class="mc__foot">${foot}</div>`:''}</div>`;
}
