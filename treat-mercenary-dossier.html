    : `<span class="kard__init" title="Initiative"><b>${String(init).padStart(2,'0')}</b></span>`;
  const outer=ready?` role="button" tabindex="0" title="Click to take ${n} back out of Readied" aria-label="Unready ${n}"`:'';
  return `<${tag} class="${cls}" data-idx="${idx}" data-src="${src}" data-panel="${panel}" data-state="${state}"${outer}>
    ${diamond}
    <span class="kard__title">${n}</span>
    <span class="kard__art"><span class="kard__panel">${source}</span></span>
    <span class="kard__box kard__box--p"><b>Primary</b>${p}</span>
    <span class="kard__box"><b>Secondary</b>${s}</span>
    <span class="kard__glyph"><span><i>🗡</i></span></span>
    <span class="kard__state"><span class="pill pill--${state}">${state}</span></span>
    ${ready?`<span class="kard__setflag"><span>Set</span></span>`:''}
  </${tag}>`;
}
function buildHand(el){
  const hand=[...SK.map(c=>[...c,'class']),...ANC.map(c=>[...c,'ancestry'])]; // 4 class + 2 ancestry (p.105/p.109)
  const sel=HAND.sel;
  el.innerHTML=`<div class="sheet">${rail()}<div class="body hand ${HAND.breath?'breathing':''}">
    <div class="table3">
      <div class="zone"><div class="zone__t"><i></i>Pool</div><div class="zone__s">Known, not picked today. Swap at the Full Rest that ends a mission (p.67).</div>
        <div class="ustack">${UNPREP.map((u,i)=>`<button class="ustk ${u[2]==='ancestry'?'ustk--anc':''}" data-u="${i}" title="${[u[0],'PRIMARY: '+u[4],'SECONDARY: '+u[5]].join(String.fromCharCode(10)).replace(/<[^>]+>/g,'')}"><b><i>${String(u[1]).padStart(2,'0')}</i></b><span>${u[0]}<small>${u[2]}${u[3]>1?' · L'+u[3]:''}</small></span></button>`).join('')}</div>
        <div class="rests">
          <button class="btn btn--ghost" id="breath" data-on="${HAND.breath}" title="Quick Breath — at the end of any scene. Press once to spend Skills you still hold: each heals by its own healing ability, or 3 as a basic action. Press again to finish — every expended power recovers, including the ones you just spent. Lost powers stay lost and no other HP returns (p.67).">Breath</button>
          <button class="btn btn--ghost" id="rest" title="Full Rest — eight hours of peace at the end of a scene. Recovers all lost HP and every power, expended AND lost, and returns every Bless and Curse to the supply (p.67, p.83).">Rest</button>
          <button class="btn btn--ghost" id="mission" data-on="${HAND.between}" title="End Mission — a Full Rest that concludes the mission. Everything a Full Rest does, and only then may you swap Skills between your Pool and your hand (p.67).">Mission</button>
        </div></div>
      <div class="zone zone--mid"><div class="zone__t"><i></i>Readied<i></i></div><div class="zone__s">Ready two. One supplies your primary action, the other your secondary. Click an initiative diamond to <b>Set</b>.</div>
        <div class="round" id="round"></div><div class="round__foot" id="roundFoot"></div>
        <div class="healtot" id="healTot"></div></div>
      <div class="deckcol">
        <div class="zone__t">Discard<i></i></div>
        <div class="minidisc ${deck.last?'':'minidisc--empty'}" id="miniDisc">${deck.last?cardFace(deck.last):'<span class="empty">nothing yet</span>'}</div>
        <div class="zone__t" style="margin-top:6px">Modifier<b id="miniN">${deck.draw.length}</b><i></i></div>
        <div class="minideck" id="miniDeck" title="Draw at the armed mode"><i></i><i></i><i></i>${deckPills()}</div>
        ${ctxBar()}
      </div>
    </div>
    <div class="sec"><h2>Prepared Hand</h2><i></i><small>${HAND.breath?'Quick Breath — click a Skill to spend it for healing':'4 class · 2 ancestry · click one to ready it'}</small></div>
    <div class="fan" id="fan">${hand.map((c,i)=>kard(c,c[7],false,i,false)).join('')}</div>
    <div class="sec"><h2>Talents</h2><i></i><small>always available · never expended</small></div>
    <div class="peek" id="peek"></div>
    <div class="talrow">${TAL.map((t,i)=>`<button class="tal ${t[4]?'tal--passive':''}" data-t="${i}" ${t[4]?'disabled':''} title="${t[2]}"><b><i>${t[4]?'✦':String(t[1]).padStart(2,'0')}</i></b><span>${t[0]}<small>${t[4]?'passive':'active talent'}</small></span></button>`).join('')}</div>
  </div></div>`;
  const round=$('#round',el),foot=$('#roundFoot',el);
  const initOf=s=>s.kind==='skill'?hand[s.i][1]:TAL[s.i][1];
  const nameOf=s=>s.kind==='skill'?hand[s.i][0]:TAL[s.i][0];
  const isSet=s=>!!HAND.set&&HAND.set.kind===s.kind&&HAND.set.i===s.i;
  const bigOf=s=>{
    const ready={state:HAND.set?(isSet(s)?'set':'dim'):'idle'};
    return s.kind==='skill'
      ? {html:kard(hand[s.i],hand[s.i][7],true,s.i,false,ready),init:hand[s.i][1],n:hand[s.i][0]}
      : {html:kard([TAL[s.i][0],TAL[s.i][1],TAL[s.i][2],TAL[s.i][3],'#3a3020','✦','available'],'talent',true,s.i,true,ready),init:TAL[s.i][1],n:TAL[s.i][0]};
  };
  /* Set = "my cards are chosen, my initiative is declared, I am ready for the
     phase." It lives on the diamond, and only on cards already in Readied. */
  const doSet=(kind,i)=>{
    if(sel.length<2){toast('Ready two powers first — one supplies your primary action, the other your secondary.');return;}
    if(HAND.set&&HAND.set.kind===kind&&HAND.set.i===i){
      HAND.set=null;toast('Stood down. Your initiative is open again.');
    }else{
      HAND.set={kind,i};
      const s={kind,i};
      toast(`<b>Set</b> at initiative ${String(initOf(s)).padStart(2,'0')}, from ${nameOf(s)}. Skills chosen in planning are expended or lost even if you forfeit the action (p.71).`);
    }
    sync();
  };
  const render=()=>{
    const picks=sel.map(bigOf);
    round.innerHTML=picks.map(p=>p.html).join('')
      +Array.from({length:2-picks.length},(_,k)=>{const n=picks.length+k;
        return `<div class="slotcard slotcard--${n+1}" role="img" aria-label="${n===0?'Ready your first power':'…and a second'}"></div>`;}).join('');
    $$('[data-set]',round).forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();doSet(b.dataset.kind,+b.dataset.set);}));
    $$('.kard',round).forEach(c=>{                              // two live areas on one card: the
      const kind=c.dataset.src==='talent'?'talent':'skill';      // diamond Sets, the body unreadies
      const drop=()=>pick(kind,+c.dataset.idx);
      c.addEventListener('click',e=>{if(!e.target.closest('[data-set]'))drop();});
      c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();drop();}});
    });
    const s=HAND.set;
    foot.innerHTML=picks.length===0?'Nothing readied yet.'
      :picks.length===1?`<b style="font-family:'Germania One';font-weight:400;letter-spacing:.06em">${nameOf(sel[0])}</b> readied — ready one more.`
      :s?`<span class="setline"><b>Set</b> initiative <em>${String(initOf(s)).padStart(2,'0')}</em><span>from ${nameOf(s)}</span></span>`
        :'Both readied. Click an initiative diamond to <b style="font-family:\'Germania One\';font-weight:400;letter-spacing:.14em">Set</b>, or a card to take it back.';
  };
  const sync=()=>{
    if(sel.length<2||!sel.some(isSet))HAND.set=null;   // the plan changed; the declaration lapses
    $$('.fan .kard',el).forEach(b=>{const i=+b.dataset.idx;
      b.dataset.state=sel.some(s=>s.kind==='skill'&&s.i===i)?'selected':hand[i][6];
      if(HAND.breath&&hand[i][6]==='available'){b.dataset.heal=String(healOf(hand[i]).n);
        b.dataset.chosen=String(HAND.heal.includes(i));}
      else {b.removeAttribute('data-heal');b.removeAttribute('data-chosen');}});
    const tot=$('#healTot',el);
    if(tot){const t=healTotal(), n=HAND.heal.length;
      tot.innerHTML=`<b>+${t}</b><button class="healbtn" id="healGo">Heal</button><small>${n?`${n} Skill${n>1?'s':''} chosen — press <b>Heal</b> to spend them and recover everything (p.67).`:'Click the Skills you want to spend. Each heals by its own ability, or 3 as a basic action (p.67).'}</small>`;
      $('#healGo',tot).addEventListener('click',()=>finishBreath());}
    $$('.tal',el).forEach(b=>{const i=+b.dataset.t;b.dataset.state=sel.some(s=>s.kind==='talent'&&s.i===i)?'selected':'';});
    $$('.ustk',el).forEach(b=>b.dataset.picked=String(HAND.swap===+b.dataset.u));
    render();
  };
  const pick=(kind,i)=>{
    const j=sel.findIndex(s=>s.kind===kind&&s.i===i);if(j>-1){sel.splice(j,1);sync();return;}
    if(cond.has('stun')){toast('Stun — you cannot perform any abilities (p.84).');return;}
    if(kind==='skill'){const st=hand[i][6];
      if(st==='expended'){toast('Expended — recovers at Quick Breath (p.67).');return;}
      if(st==='lost'){toast('Lost — recovers at Full Rest (p.67).');return;}
      if(st==='persistent'){toast('Persistent — in play until its effect ends, then expended or lost (p.72).');return;}}
    if(sel.length>=2){toast('Two powers are already readied. Take one back out first.');return;}
    sel.push({kind,i});sync();
  };
  /* PEEK — build the Readied card itself and float it over the fan. Nothing is
     scaled, so its type is the Readied type by construction, not by arithmetic. */
  const layer=$('#peek',el), handEl=$('.hand',el), BW=176, BH=Math.round(176*1.52);
  /* The full-card overlay belongs to the prepared hand only. Pool chips zoom
     themselves in place instead (CSS), so nothing floats a card over the page
     when you are only scanning names. */
  const showPeek=c=>{
    const i=+c.dataset.idx;
    layer.innerHTML=kard(hand[i],hand[i][7],true,i,false);
    layer.style.left=Math.round(clamp(c.offsetLeft+(c.offsetWidth-BW)/2,0,handEl.clientWidth-BW))+'px';
    layer.style.top =Math.round(clamp(c.offsetTop+c.offsetHeight-BH-6,0,handEl.clientHeight-BH))+'px';
    layer.classList.add('on');
  };
  const hidePeek=()=>{layer.classList.remove('on');layer.innerHTML='';};
  /* swapping is a Full Rest action, and only one that ends a mission (p.67) */
  const swapPick=i=>{
    if(!HAND.between){toast('You may choose different Skills only at the Full Rest that ends a mission (p.67). Press <b>Mission</b> first.');return;}
    HAND.swap=HAND.swap===i?null:i;
    if(HAND.swap!=null)toast(`<b>${UNPREP[i][0]}</b> picked up — now click a ${UNPREP[i][2]} Skill in your hand to trade it out.`);
    sync();
  };
  const swapDo=fanIdx=>{
    const u=UNPREP[HAND.swap], isAnc=fanIdx>=SK.length, src=isAnc?'ancestry':'class';
    if(u[2]!==src){toast(`${u[0]} is ${u[2]==='class'?'a class':'an ancestry'} Skill — it can only trade with another ${u[2]} Skill (p.105, p.109).`);return;}
    const arr=isAnc?ANC:SK, k=isAnc?fanIdx-SK.length:fanIdx, out=arr[k];
    arr[k]=[u[0],u[1],u[4],u[5],out[4],out[5],'available'];
    UNPREP[HAND.swap]=[out[0],out[1],src,lvlOf(out[0]),out[2],out[3]];
    toast(`<b>${u[0]}</b> swapped in for <b>${out[0]}</b>.`);
    HAND.swap=null; sync();
  };
  $$('.fan .kard',el).forEach(b=>{
    const i=+b.dataset.idx;
    b.addEventListener('click',()=>{
      if(HAND.breath){breathToggle(i);return;}
      if(HAND.between&&HAND.swap!=null){swapDo(i);return;}
      pick('skill',i);});
    b.addEventListener('mouseenter',()=>{if(!HAND.breath)showPeek(b);});
    b.addEventListener('mouseleave',hidePeek);
    b.addEventListener('focus',()=>{if(!HAND.breath)showPeek(b);});
    b.addEventListener('blur',hidePeek);
  });
  $$('.ustk',el).forEach(b=>b.addEventListener('click',()=>swapPick(+b.dataset.u)));
  /* Three rests, three different resets (p.67). The sheet performs them; it
     never decides for you — the Quick Breath option to spend your remaining
     Skills as healing is a choice, so it is described, not automated. */
  const setStates=fn=>{SK.forEach(fn);ANC.forEach(fn);};
  /* p.67 orders it: you may FIRST expend Skills you still hold for healing,
     you THEN recover everything expended. So Breath is two presses, and the
     recovery belongs to the second. Which Skills to spend is the player's
     call, so the sheet offers them and never picks. */
  /* p.67 lets you spend Skills you still hold, THEN recovers everything
     expended. Choosing is a decision, so the sheet only collects the set;
     nothing resolves until the second press. */
  const healTotal=()=>HAND.heal.reduce((n,i)=>n+healOf(hand[i]).n,0);
  const breathToggle=i=>{
    if(hand[i][6]!=='available'){toast('Only a Skill you still hold can be spent for healing (p.67).');return;}
    const j=HAND.heal.indexOf(i);
    if(j>-1)HAND.heal.splice(j,1); else HAND.heal.push(i);
    sync();
  };
  /* Breath (second press) and Heal are the same act, so they are the same
     function — the button just puts it where your eyes already are. */
  const finishBreath=()=>{
    const total=healTotal(), before=T.hp.value, n=HAND.heal.length;
    HAND.heal.forEach(i=>{const a=i>=SK.length?ANC:SK;a[i>=SK.length?i-SK.length:i][6]='expended';});
    T.hp.value=Math.min(T.hp.max,T.hp.value+total);
    setStates(c=>{if(c[6]==='expended')c[6]='available';});   // p.67; lost stays lost
    HAND.heal.length=0; HAND.breath=false;
    toast(total
      ? `<b>Quick Breath</b> — ${n} Skill${n>1?'s':''} spent for ${total} healing, ${T.hp.value-before} applied. Now ${T.hp.value}/${T.hp.max}. Every expended power recovers, the spent ones included; lost powers stay lost (p.67).`
      : '<b>Quick Breath</b> — nothing spent. Every expended power recovers; lost powers stay lost (p.67).');
    repaint();
  };
  $('#breath',el).addEventListener('click',()=>{
    if(HAND.breath){finishBreath();return;}
    HAND.breath=true; HAND.swap=null; HAND.heal.length=0; HAND.sel.length=0; HAND.set=null;
    hidePeek();
    toast('<b>Quick Breath</b> — choose any Skills you still hold to spend: each heals by its own healing ability, or 3 as a basic action. Press <b>Heal</b> to spend them and recover everything (p.67).');
    repaint();
  });
  const fullRest=endsMission=>{
    // ⚠ recovering a PERSISTENT card here is an inference: p.72 ends the
    // effect, p.67 recovers "all of your powers, both expended and lost".
    setStates(c=>{c[6]='available';});
    T.hp.value=T.hp.max;
    shedTemp('bless'); shedTemp('curse');
    HAND.sel.length=0; HAND.set=null; HAND.swap=null;
    HAND.between=!!endsMission;
    toast(endsMission
      ? '<b>End of mission</b> — a Full Rest that concludes it: all lost HP and every power recover, Bless and Curse leave the deck, and you may now swap Skills between your Pool and your hand (p.67, p.83).'
      : '<b>Full Rest</b> — all lost HP and every power recover, expended and lost alike, and every Bless and Curse leaves the deck (p.67, p.83).');
    repaint();
  };
  $('#rest',el).addEventListener('click',()=>fullRest(false));
  $('#mission',el).addEventListener('click',()=>{
    if(HAND.between){HAND.between=false;HAND.swap=null;
      toast('Mission underway — your Skills are locked until the next Full Rest that ends a mission (p.67).');repaint();}
    else fullRest(true);
  });
  $$('.tal:not([disabled])',el).forEach(b=>b.addEventListener('click',()=>pick('talent',+b.dataset.t)));
  $('#miniDeck',el).addEventListener('click',e=>{                 // the card back is still a draw target,
    if(e.target.closest('[data-draw]'))return;                    // but a pill click must not fire twice
    const r=resolveDraw(autoMode().mode);announce(r);if(r)repaint();});
  wireDraws(el);
  sync();
}

/* ============================================================ DECK */
function buildDeck(el){
  const p=deck.pair;
  el.innerHTML=`<div class="sheet">${rail()}<div class="body">
    <div class="deck">
      <div class="table">
        ${sec('Modifier Deck','every test and attack draws · two values per card')}
        <div class="felt">

          <div><div class="flip" id="flip"><div class="flip__in"><div class="face face--back"></div><div class="face face--front" id="flipFront">${cardFace(deck.last)}</div></div></div></div>
          <div><div class="pile pile--discard" data-empty="${deck.discard.length===0}"><i></i><i></i><div class="pile__back"></div></div><div class="pile__lbl">Discard<b id="nDisc">${deck.discard.length}</b></div></div>
        </div>
        <div class="pair" id="pairRow">${p?`${p.cards.map(c=>`<div class="pairc ${c===p.kept?'kept':''}"><b>${label(c)}</b><small>${ctxMode==='attack'?(c.temp||c.r==='B'||c.r==='R'?'—':(c.atk>0?'+':'')+c.atk):(c.temp||c.r==='B'||c.r==='R'?'—':'+'+c.attr)}</small></div>`).join('')}
          <span class="pairlbl">${p.mode==='advantage'?'Advantage: two drawn, the better kept':'Disadvantage: two drawn, the worse kept'} — read on the <b>${ctxMode==='attack'?'attack':'Attribute'}</b> column (p.63).</span>`
          :'<span class="pairlbl">Advantage and disadvantage draw two and keep one. Both cards are shown here so the choice is auditable (p.63).</span>'}</div>
        ${drawBar()}
        <div style="display:flex;align-items:center;gap:10px">${ctxBar()}<span class="note" style="flex:1">Which value the sheet compares changes with the column you are reading — the attack modifier is the big circle, the Attribute modifier the small hexagon (p.62).</span></div>
        <div class="counts">
          <div class="count"><span>Bless</span><b id="nBless">${deck.bless}</b><div class="pips">${Array.from({length:6},(_,i)=>`<i class="${i<deck.bless?'on':''}"></i>`).join('')}</div></div>
          <div class="count"><span>Curse</span><b id="nCurse">${deck.curse}</b><div class="pips pips--curse">${Array.from({length:6},(_,i)=>`<i class="${i<deck.curse?'on':''}"></i>`).join('')}</div></div>
          <div class="count"><span>In deck</span><b>${deck.draw.length+deck.discard.length}</b><small>${BASE.length} base + ${deck.bless+deck.curse} temp</small></div>
          <div class="count"><span>Last</span><b>${deck.last?label(deck.last):'—'}</b></div>
        </div>
        ${sec('Draw log')}
        <div class="log scroll" id="log">${deck.log.length?deck.log.map(l=>`<div><b>${l.lbl}</b><span>${l.txt}${l.mode!=='normal'?` · ${l.mode}`:''}${l.tie?' · tie, GM decides':''}</span><small>${l.t}</small></div>`).join('')
          :'<div style="color:var(--ink-3);font-style:italic;border:0">Nothing drawn yet this scene.</div>'}</div>
      </div>
      <aside class="side">
        ${condStrip()}
        ${sec('Composition',ctxMode==='attack'?'attack values':'attribute values')}
        <div class="comp">${BASE.map(c=>{
          if(c[0]==='B')return'<i class="x">×2</i>'; if(c[0]==='R')return'<i class="nul">NULL</i>';
          const v=ctxMode==='attack'?c[3]:c[2];
          return `<i class="${ctxMode==='test'?'':(v<0?'minus':v>0?'plus':'')}">${ctxMode==='attack'?(v>0?'+':'')+v:v}</i>`;}).join('')}
          ${Array.from({length:deck.bless},()=>'<i class="bl">BL</i>').join('')}${Array.from({length:deck.curse},()=>'<i class="cu">CU</i>').join('')}</div>
        ${sec('Gained Perks','permanent deck edits')}
        <div class="perks">${T.perks.map(p2=>`<div class="perk"><span class="n">${p2[0]}</span><div>${p2[1]}${p2[2]?`<small>cards: ${p2[2]}</small>`:''}</div></div>`).join('')}</div>
        <div class="note" style="margin-top:auto">The player never shuffles or discards by hand. Critical and Null trigger the reshuffle; Bless and Curse return to the supply and explicitly do <b>not</b> (p.62, p.83).</div>

  wireConds(el);

/* ============================================================ STATS */
function buildStats(el){
  const cap=3,points=6;
  el.innerHTML=`<div class="sheet">${rail()}<div class="body stats">
    ${sec('Attributes','click one to test it — draws at the armed mode')}
    <div class="hexes">${T.attrs.map(a=>`<button class="hex" data-a="${a[0]}" data-v="${a[2]}">${hexSVG}<b>${a[2]}</b><span>${a[1]}</span><small>${a[3]}</small></button>`).join('')}</div>
    <div class="test" id="test"><span class="test__hint">An Attribute test = Attribute + the card’s Attribute value + any legal bonus, against a Target Number the GM sets (p.66–69).</span><span></span>
      <span class="tn">TN <input type="number" id="tn" value="6" min="1" max="20" aria-label="Target number"></span></div>
    ${condStrip()}
    ${backgroundsBlock()}
    <div class="grid2">
      <div>${sec('Level','from the Leveling Guide · p.120')}
        <div class="lvl"><div class="count"><span>Attr cap</span><b>${cap}</b></div><div class="count"><span>Attr points</span><b>${points}</b></div><div class="count"><span>Small slots</span><b>2</b></div></div>
        <div class="note">Cap rises with level (3/3/4/4/5/5/6/6/7). HP track comes from the class. Level-up is a guided workflow, not an XP bar (guide §13.4); the trigger is a GM setting because the draft disagrees with itself (p.119 vs p.266).</div>
      </div>
      <div>${sec('Faction Standing','all seven · ✦ active')}
        <div class="facs scroll">${T.factions.map(f=>`<div class="fac ${f[6]?'active':''}"><b>${f[1]}</b><span class="tiers">${[1,2,3,4,5].map(t=>`<i class="${t<f[2]?'on':''} ${t===f[2]?'cur':''}">${t}</i>`).join('')}<i class="skull ${f[2]===0?'hostile':''}" title="Hostile">☠</i><span class="tally" title="successes / failures">${f[4]}✓ ${f[5]}✗</span></span></div>`).join('')}</div>
      </div>
    </div>
  </div></div>`;
  $$('.hex',el).forEach(b=>b.addEventListener('click',()=>{
    const prev=ctxMode; ctxMode='test';                       // an Attribute test reads the hexagon (p.62)
    const r=resolveDraw(autoMode().mode,'test'); ctxMode=prev;
    if(!r)return;
    const v=+b.dataset.v,name=$('span',b).textContent,c=r.kept,tn=+$('#tn',el).value;
    const crit=c.r==='B'||c.temp==='bless', nul=c.r==='R'||c.temp==='curse';
    const total=nul?null:crit?'crit':v+c.attr;
    const ok=crit||(total!==null&&total>=tn);
    const eq=`<span class="eq"><span><small>${name}</small>${v}</span><span class="op">+</span><span><small>card ${label(c)}</small>${nul?'null':crit?'crit':c.attr}</span><span class="op">=</span><span class="tot">${nul?'—':crit?'✦':total}</span></span>`;
    $('#test',el).innerHTML=`${eq}<span></span><span class="res ${nul?'no':ok?'ok':'no'}">${nul?'Null · fail':crit?'Critical':ok?`Success vs ${tn}`:`Fail vs ${tn}`}</span>`;
    announce(r);
  }));
  wireBackgrounds(el); wireConds(el);
}

/* ============================================================ INVENTORY */
function buildInventory(el){
  el.innerHTML=`<div class="sheet">${rail()}<div class="body">
    <div class="inv">
      <div>${sec('Equipped','one each · Small = ½ level ↑ · p.86')}
        <div class="slots scroll">${T.slots.map(s=>`<div class="slot ${s[0]==='Small'?'slot--small':''}"><span class="slot__k">${s[0]}</span><span class="slot__n">${s[1]}<small>${s[2]}</small></span><span class="pill pill--ready">${s[2].startsWith('Consumed')?'consumed':s[2].startsWith('Expended')?'expended':'active'}</span></div>`).join('')}
        <div class="slot slot--small slot--empty"><span class="slot__k">Small</span><span class="slot__n">— empty —</span><span></span></div></div>
      </div>
      <div>${sec('Carried','up to five beyond your slots · p.86')}
        <div class="carry scroll">${T.carried.map(c=>`<div class="item"><div><b>${c[0]}</b><small>${c[1]}</small></div><span class="w" title="inventory space">${c[2]}</span><span class="pill pill--ready">carried</span></div>`).join('')}</div>
        <div class="cap"><span>space</span><div class="bar"><i style="--p:55%"></i></div><span>2¾ of 5</span></div>
        ${sec('Company stores','shared · fills an undeclared slot mid-scene')}
        <div class="company"><b>The Company</b><span>14 items in stores · <i>Minor Stamina Potion, Rope, Torch ×6, Antitoxin…</i></span><button class="btn btn--ghost" style="margin-left:auto">Open</button></div>
      </div>
    </div></div></div>`;
}

/* ============================================================ NAV + BOOT */
const pages={cover:buildCover,profile:buildProfile,hand:buildHand,deck:buildDeck,stats:buildStats,inventory:buildInventory};
let current=null;
function paint(id){
  const el=$(`.page[data-page="${id}"]`);
  el.innerHTML=''; pages[id](el);
}
/* every visible page redraws from one state, so the deck, the conditions
   and the armed button can never disagree between tabs */
function repaint(){ if(current) paint(current); }
function go(id){
  if(!pages[id]) id='cover';
  current=id; paint(id);
  $$('.page').forEach(p=>p.classList.toggle('on',p.dataset.page===id));
  $$('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.go===id?'true':'false'));
  store('page',id);                                    // the book reopens where it was closed
  try{history.replaceState(null,'','#'+id);}catch(e){}
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)go(g.dataset.go);});
document.addEventListener('keydown',e=>{
  if(e.target instanceof Element && e.target.matches('input,textarea'))return;
  const k={'0':'cover','1':'hand','2':'deck','3':'stats','4':'inventory','5':'profile'}[e.key];
  if(k){go(k);return;}
  if(e.key==='d'||e.key==='D'){const r=resolveDraw(autoMode().mode);announce(r);if(r)repaint();}
});

/* ---- the window: ruthlessly resizeable, hard stops at both ends ---- */
const WIN={base:{w:700,h:700},min:{w:560,h:560},max:{w:1180,h:1180}};
const win=$('#win'),scaler=$('#scaler'),dimOut=$('#dim'),barDim=$('#barDim');
function setWin(w,h,save=true){
  w=Math.round(clamp(w,WIN.min.w,WIN.max.w)); h=Math.round(clamp(h,WIN.min.h,WIN.max.h));
  win.style.setProperty('--fw',w+'px'); win.style.setProperty('--fh',h+'px');
  const s=Math.min(w/WIN.base.w,h/WIN.base.h);
  scaler.style.setProperty('--s',s);
  win.classList.toggle('atmin',w<=WIN.min.w&&h<=WIN.min.h);
  win.classList.toggle('atmax',w>=WIN.max.w||h>=WIN.max.h);
  dimOut.textContent=`${w} × ${h}`;
  barDim.textContent=`${Math.round(s*100)}%`;
  if(save) store('win',{w,h});
}
$$('[data-size]').forEach(b=>b.addEventListener('click',()=>{
  const k=b.dataset.size;
  setWin(...(k==='min'?[WIN.min.w,WIN.min.h]:k==='max'?[WIN.max.w,WIN.max.h]:[WIN.base.w,WIN.base.h]));
}));
$$('[data-grip]').forEach(g=>g.addEventListener('pointerdown',e=>{
  e.preventDefault(); g.setPointerCapture(e.pointerId); win.classList.add('dragging');
  const dir=g.dataset.grip, x0=e.clientX, y0=e.clientY;
  const r=win.getBoundingClientRect(), w0=r.width, h0=r.height;
  const move=ev=>setWin(dir==='s'?w0:w0+(ev.clientX-x0), dir==='e'?h0:h0+(ev.clientY-y0));
  const up=()=>{win.classList.remove('dragging');g.removeEventListener('pointermove',move);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);};
  g.addEventListener('pointermove',move); g.addEventListener('pointerup',up); g.addEventListener('pointercancel',up);
}));
const saved=recall('win',WIN.base); setWin(saved.w,saved.h,false);
go(location.hash.slice(1)||recall('page','cover'));
</script>
